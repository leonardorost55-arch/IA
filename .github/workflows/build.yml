name: Compilar AFTERIMAGE
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: afterimage-arg
          path: build/libs/*.jar
